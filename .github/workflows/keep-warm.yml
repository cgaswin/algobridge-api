name: Keep API warm

# Render's free plan sleeps after 15 idle minutes and takes about a minute to
# wake. Pinging /health keeps the first request in each session fast.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.API_BASE_URL != ''
    steps:
      - name: Ping health check
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 "${{ vars.API_BASE_URL }}/health"
