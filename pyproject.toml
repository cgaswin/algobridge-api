[project]
name = "algobridge-api"
version = "1.0.0"
description = "FastAPI backend for transforming coding problems into real-world engineering insights"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.135.1",
    "google-genai>=1.68.0",
    "psycopg[binary]>=3.2.9",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.36",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
